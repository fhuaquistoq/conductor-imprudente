[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foottracker"
version = "1.0.0"
description = "Clasificador rojo/verde de pedales para Taxi VR enviado por UDP local"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
package = ["pyinstaller>=6.0"]

[project.scripts]
foottracker = "foottracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
